<!DOCTYPE html>
<html data-bs-theme="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Web</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body style="width: auto;height: 100%;">
    <div class="col col-lg-12 offset-lg-0" style="width: 100%;height: 100%;">
        <div class="row" style="height: 12%;background: var(--bs-secondary-bg-subtle);margin: 0;">
            <div class="col d-flex flex-row justify-content-center" style="padding: 0;">
                <div class="container d-flex" style="width: 100%;padding: 0;padding-left: 20px;">
                    <div class="row" style="width: 80%;margin: 0;">
                        <div class="col-md-4" style="padding: 0;">
                            <p class="d-flex justify-content-center align-items-center" style="text-align: center;width: 100%;height: 100%;font-size: 24px;color: var(--bs-gray-700);font-weight: bold;">Sunny Inc</p>
                        </div>
                        <div class="col-md-4" style="padding: 0;"><button class="btn btn-primary" id="openShipsPageButton" type="button" style="height: 100%;width: 100%;border-radius: 0;border-width: 0px;background: var(--bs-secondary-bg-subtle);font-weight: bold;font-size: 24px;color: rgb(33, 37, 41);padding: 0;" onclick="ShowShipsPage()">Ships</button></div>
                        <div class="col-md-4" style="padding: 0;"><button class="btn btn-primary" id="openNewShipPageButton" type="button" style="height: 100%;width: 100%;border-radius: 0;border-width: 0px;background: var(--bs-secondary-bg-subtle);font-weight: bold;font-size: 24px;color: rgb(33, 37, 41);padding: 0;" onclick="ShowNewShipPage(-1)">Add New</button></div>
                    </div>
                </div>
            </div>
            <div class="col d-flex flex-row justify-content-center" style="padding: 0;width: 90%;">
                <div class="container d-flex justify-content-end" style="padding: 0;padding-right: 20px;">
                    <div class="row" style="margin: 0;">
                        <div class="col-md-8 d-flex justify-content-end align-items-center" style="padding: 0;padding-right: 5px;"><input type="text" id="searchFilterInput" style="width: 300px;height: 40px;text-align: right;font-size: 20px;padding-right: 4px;padding-left: 4px;"></div>
                        <div class="col-md-4 d-flex justify-content-start align-items-center" style="padding: 0;padding-left: 5px;"><button class="btn btn-primary" type="button" style="width: 140px;font-size: 20px;font-weight: bold;background: var(--bs-light);border-width: 2px;border-color: var(--bs-info);color: var(--bs-info);" onclick="UpdateSearchFilter()">Search</button></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row" id="shipsPage" style="height: 88%;margin: 0;padding: 20px;width: 100%;padding-left: 0px;padding-right: 0px;">
            <div class="col col-lg-2" style="width: 300px;height: auto;border-right-width: 0px;border-right-style: solid;">
                <p style="width: 100%;margin: 0;margin-top: 40px;text-align: center;font-weight: bold;font-size: 24px;">Manage Ships</p>
                <div class="row" style="margin-right: 0;margin-left: 0;margin-top: 40px;">
                    <div class="col" style="padding: 0;">
                        <p class="d-flex justify-content-end align-items-center" style="width: 100%;height: 100%;text-align: right;font-weight: bold;font-size: 20px;line-height: 20px;">Sort by:</p>
                    </div>
                    <div class="col"><select id="sortMethodSelect" style="font-size: 24px;color: rgb(0, 0, 0);width: 150px;font-weight: bold;border-width: 2px;border-radius: 5px;" onchange="DisplayCards()">
                            <option value="1" selected="">Name</option>
                            <option value="2">Passengers</option>
                            <option value="3">Mass</option>
                        </select></div>
                </div>
                <hr style="color: var(--bs-gray-dark);border-width: 5px;border-radius: 2px;margin-top: 30px;margin-bottom: 0;">
                <p id="total__weight__label" style="margin-top: 30px;text-align: center;font-size: 20px;line-height: 20px;font-weight: bold;">Total weight: 3000t</p>
            </div>
            <div class="col d-flex flex-row justify-content-start flex-wrap" id="cardHolder" style="width: auto;height: auto;padding-top: 20px;">
                <div id="templateCard" class="card__body" style="width: 220px;height: 300px;border-radius: 5px;border-width: 2px;border-color: var(--bs-secondary);background: var(--bs-gray-200);margin: 5px;"><img class="object-fit-cover card__image" width="186" height="152" style="width: 100%;height: 150px;border-top-left-radius: 5px;border-top-right-radius: 5px;" loading="lazy" src="assets/img/ship.jpg">
                    <p class="card__name" style="width: 100%;text-align: center;font-weight: bold;height: 49px;margin: 0px;margin-top: 5px;">Royal Navy Destroyer blablabla</p>
                    <p class="card__passengers" style="margin-bottom: 0;padding-left: 20px;">Passengers: 1000</p>
                    <p class="card__mass" style="margin-bottom: 0;padding-left: 20px;">Mass: 100t</p>
                    <div class="row" style="width: 100%;height: auto;margin: 0;padding: 0;margin-top: 5px;">
                        <div class="col d-flex justify-content-end" style="padding: 0;"><button class="btn btn-primary card__edit__button" type="button" style="border-top-right-radius: 0;border-bottom-right-radius: 0;width: 80%;line-height: 18px;background: var(--bs-gray-200);color: var(--bs-info);font-weight: bold;border-width: 2px;border-color: var(--bs-info);">Edit</button></div>
                        <div class="col d-flex justify-content-start" style="padding: 0;"><button class="btn btn-primary card__delete__button" type="button" style="border-top-left-radius: 0;border-bottom-left-radius: 0;width: 80%;line-height: 18px;border-width: 2px;border-color: var(--bs-pink);background: var(--bs-gray-200);color: var(--bs-pink);font-weight: bold;">Delete</button></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row text-center justify-content-center" id="newShipPage" style="height: 50%;margin: 0;padding: 20px;width: 100%;padding-left: 0px;max-height: 50%;">
            <div class="col d-flex flex-column align-items-center" style="width: 20%;max-width: 20%;">
                <p style="font-weight: bold;font-size: 32px;margin-top: 10px;">Create Ship</p>
                <p style="font-size: 24px;text-align: left;margin-top: 10px;width: 80%;">Name</p><input type="text" id="CreateShipName" style="width: 80%;">
                <p style="font-size: 24px;text-align: left;margin-top: 20px;width: 80%;">Passengers</p><input type="number" id="CreateShipPassengers" style="width: 80%;">
                <p style="text-align: left;font-size: 24px;margin-top: 20px;width: 80%;">Mass</p><input type="number" id="CreateShipMass" style="width: 80%;"><button class="btn btn-primary" type="button" style="margin-top: 40px;width: 200px;background: #ffffff;font-size: 24px;font-weight: bold;color: var(--bs-teal);border-width: 5px;border-color: var(--bs-teal);" onclick="SaveCardByID()">Save</button>
            </div>
        </div>
    </div>
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/js/contentFillament.js"></script>
    <script src="assets/js/styles.js"></script>
</body>

</html>
